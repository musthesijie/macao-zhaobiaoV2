services:
  macao-zhaobiao:
    build: .
    container_name: macao-zhaobiao-v2
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      REFRESH_INTERVAL: "${REFRESH_INTERVAL:-21600}"
      REFRESH_TOKEN: "${REFRESH_TOKEN:-}"
      TENDER_APP_CODE: "${TENDER_APP_CODE:-09d43a591fba407fb862412970667de4}"
    volumes:
      - tender-data:/data
volumes:
  tender-data:
